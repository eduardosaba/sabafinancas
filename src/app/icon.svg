<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#022c22" />
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="16" />
  
  <!-- Wallet Body -->
  <rect x="96" y="144" width="320" height="240" rx="32" fill="#0f172a" stroke="url(#emeraldGrad)" stroke-width="20" />
  
  <!-- Flap / Accent -->
  <path d="M 96 176 L 416 176" stroke="url(#emeraldGrad)" stroke-width="12" opacity="0.6" />
  <rect x="288" y="224" width="128" height="80" rx="20" fill="url(#emeraldGrad)" />
  <circle cx="336" cy="264" r="16" fill="#ffffff" />
  
  <!-- Upward Trend Arrow -->
  <path d="M 144 320 L 208 256 L 256 288 L 336 208" fill="none" stroke="url(#blueGrad)" stroke-width="20" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M 288 208 L 336 208 L 336 256" fill="none" stroke="url(#blueGrad)" stroke-width="20" stroke-linecap="round" stroke-linejoin="round" />
</svg>
